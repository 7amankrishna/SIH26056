# Nginx configuration for the APIx SPA.
# Serves the production build and proxies API + documentation to the backend.
# The backend service is referenced by its Docker Compose network name "backend".

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxying to the FastAPI backend.
    # In Docker Compose the frontend reaches the backend via the service name.
    # VITE_API_TARGET is not available at runtime in Nginx, so we proxy to the
    # fixed backend service name; this matches docker-compose.yml.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Gzip for text assets.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 512;
}
