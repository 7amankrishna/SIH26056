<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1120" height="560" fill="#f1f5f9"/>

  <!-- header -->
  <rect x="0" y="0" width="1120" height="72" fill="url(#head)"/>
  <text x="32" y="44" fill="#ffffff" font-size="22" font-weight="700">APIx — Real-Time Airfare Price Index for India</text>
  <text x="32" y="62" fill="#e0f2fe" font-size="12">Observe · Validate · Normalize · Aggregate · Explain · Audit</text>

  <!-- title for backend -->
  <text x="32" y="116" fill="#475569" font-size="12" font-weight="600" letter-spacing="1">DATA PIPELINE (BACKEND)</text>

  <!-- pipeline row -->
  <g>
    <!-- Source -->
    <rect x="32" y="132" width="150" height="64" rx="10" fill="url(#box)" stroke="#e2e8f0"/>
    <text x="107" y="162" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="600">Source</text>
    <text x="107" y="180" text-anchor="middle" fill="#64748b" font-size="10">adapters · feeds · mock</text>

    <!-- Collection -->
    <rect x="210" y="132" width="150" height="64" rx="10" fill="url(#box)" stroke="#e2e8f0"/>
    <text x="285" y="162" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="600">Collection</text>
    <text x="285" y="180" text-anchor="middle" fill="#64748b" font-size="10">search() · health_check()</text>

    <!-- Raw storage -->
    <rect x="388" y="132" width="150" height="64" rx="10" fill="url(#box)" stroke="#e2e8f0"/>
    <text x="463" y="162" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="600">Raw storage</text>
    <text x="463" y="180" text-anchor="middle" fill="#64748b" font-size="10">raw_payload_reference</text>

    <!-- Normalization -->
    <rect x="566" y="132" width="150" height="64" rx="10" fill="url(#box)" stroke="#e2e8f0"/>
    <text x="641" y="162" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="600">Normalization</text>
    <text x="641" y="180" text-anchor="middle" fill="#64748b" font-size="10">canonical fare model</text>

    <!-- Quality engine -->
    <rect x="744" y="132" width="150" height="64" rx="10" fill="url(#box)" stroke="#e2e8f0"/>
    <text x="819" y="162" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="600">Quality engine</text>
    <text x="819" y="180" text-anchor="middle" fill="#64748b" font-size="10">VALID / SUSPICIOUS / …</text>

    <!-- Store -->
    <rect x="922" y="132" width="166" height="64" rx="10" fill="url(#box)" stroke="#e2e8f0"/>
    <text x="1005" y="162" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="600">Store</text>
    <text x="1005" y="180" text-anchor="middle" fill="#64748b" font-size="10">PostgreSQL · JSONB payloads</text>

    <!-- arrows -->
    <line x1="182" y1="164" x2="210" y2="164" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="360" y1="164" x2="388" y2="164" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="538" y1="164" x2="566" y2="164" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="716" y1="164" x2="744" y2="164" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="894" y1="164" x2="922" y2="164" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- title for index -->
  <text x="32" y="244" fill="#475569" font-size="12" font-weight="600" letter-spacing="1">INDEX &amp; ACCESS</text>

  <!-- index engine row -->
  <g>
    <rect x="32" y="268" width="188" height="96" rx="12" fill="url(#box)" stroke="#e2e8f0"/>
    <text x="126" y="294" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="700">Index engine</text>
    <text x="126" y="312" text-anchor="middle" fill="#475569" font-size="11">Route price · route index</text>
    <text x="126" y="328" text-anchor="middle" fill="#475569" font-size="11">Weighted APIx · lead time</text>
    <text x="126" y="344" text-anchor="middle" fill="#64748b" font-size="10">deterministic · auditable</text>

    <rect x="256" y="268" width="188" height="96" rx="12" fill="url(#box)" stroke="#e2e8f0"/>
    <text x="350" y="294" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="700">FastAPI</text>
    <text x="350" y="312" text-anchor="middle" fill="#475569" font-size="11">Typed Pydantic responses</text>
    <text x="350" y="328" text-anchor="middle" fill="#475569" font-size="11">methodology &amp; weight version</text>
    <text x="350" y="344" text-anchor="middle" fill="#64748b" font-size="10">OpenAPI docs · /docs</text>

    <line x1="220" y1="316" x2="256" y2="316" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- provenance -->
  <g>
    <rect x="480" y="268" width="188" height="96" rx="12" fill="url(#box)" stroke="#e2e8f0"/>
    <text x="574" y="294" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="700">Provenance</text>
    <text x="574" y="312" text-anchor="middle" fill="#475569" font-size="11">APIx → route → fare</text>
    <text x="574" y="328" text-anchor="middle" fill="#475569" font-size="11">→ source → raw payload</text>

    <rect x="704" y="268" width="188" height="96" rx="12" fill="url(#box)" stroke="#e2e8f0"/>
    <text x="798" y="294" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="700">Quality &amp; monitoring</text>
    <text x="798" y="312" text-anchor="middle" fill="#475569" font-size="11">Data quality score</text>
    <text x="798" y="328" text-anchor="middle" fill="#475569" font-size="11">Collection audit API</text>

    <line x1="668" y1="316" x2="704" y2="316" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- react dashboard -->
  <rect x="928" y="268" width="160" height="96" rx="12" fill="url(#box)" stroke="#e2e8f0"/>
  <text x="1008" y="300" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="700">React dashboard</text>
  <text x="1008" y="318" text-anchor="middle" fill="#475569" font-size="11">Statistical intelligence</text>
  <text x="1008" y="334" text-anchor="middle" fill="#475569" font-size="11">heatmaps · KPIs · drill-down</text>
  <line x1="892" y1="316" x2="928" y2="316" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- footer note -->
  <rect x="32" y="392" width="1056" height="52" rx="10" fill="#fff" stroke="#e2e8f0"/>
  <text x="52" y="418" fill="#334155" font-size="12" font-weight="600">One principle</text>
  <text x="52" y="434" fill="#64748b" font-size="11">Every index value can be traced back to underlying observations, sources and raw payloads. Uncertainty is shown, not hidden.</text>

  <!-- demo badge -->
  <rect x="908" y="470" width="180" height="40" rx="20" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="998" y="494" text-anchor="middle" fill="#c2410c" font-size="12" font-weight="700">DEMO MODE · OFFLINE</text>
  <text x="32" y="494" fill="#64748b" font-size="11">Deterministic synthetic dataset · 24 routes · 6 airlines · 5 active sources · 90 days</text>
</svg>
